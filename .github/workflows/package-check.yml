name: Package check

# Dry run only. -d is the real no-upload switch: merely leaving CF_API_KEY out
# still lets the packager cut a GitHub release. Publishing is CurseForge's own
# packager, triggered by the repository webhook on a tag (AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check the Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          files=$(grep -v '^#' Apotheca.toc | tr -d '\r' | sed '/^$/d')
          luac5.1 -p $files Tools/ApothecaProbe/ApothecaProbe.lua

      # ApothecaItems.lua is generated; it must match what the generator
      # makes from the committed scan, or someone hand-edited it.
      - name: Item data matches its generator
        run: |
          # Items deliberately left out must be in the skipped report, not
          # lost: Whipper Root Tuber and Full Moonshine (own cooldown),
          # Restorative Bread (percentage), Scooby Snack (no Use text),
          # Mana Ruby (off the potion buttons), Specklefin Feast (a feast), the
          # Runecarving Test poison, Consecrated Sharpening Stone (undead only).
          # And items the bar must offer are present: potions, healthstones,
          # a ration, Holy Water, Dense Runecloth, Forest Mushroom Cap, and
          # Mana Ruby on its own mana gem button, Beer Basted Boar Ribs (XP food)
          # Instant Poison, and the stones (sharpening, weight, Elemental).
          python3 Tools/build_item_tables.py docs/forever-consumables-70009.tsv \
            --expect-skipped 11951 1072 282018 8243 8008 238641 202316 23122 \
            --expect-present 13446 13444 9421 19013 19060 227813 232433 4604 8008 2888 6947 7964 12643 18262 > /dev/null
          git diff --exit-code --ignore-cr-at-eol ApothecaItems.lua

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # Same packager SHA as Priestly, which carries Forever flavor support.
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip must hold the TOC, the Lua it lists and Bindings.xml, and
      # nothing else (the release workflow runs the same check).
      - name: The package ships only the addon files
        run: Tools/check_package.sh "$(ls .release/*.zip | head -1)"

      # The changelog section the GitHub release would use must exist.
      - name: Release notes script
        run: Tools/changelog_section.sh "$(grep -m1 -o '^## \[[0-9.]*\]' CHANGELOG.md | tr -dc '0-9.')" > /dev/null

      # .release is hidden; upload-artifact skips hidden content by default.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: apotheca-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
