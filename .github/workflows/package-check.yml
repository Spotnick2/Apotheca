name: Package check

# Dry run only. -d is the real no-upload switch: merely leaving CF_API_KEY out
# still lets the packager cut a GitHub release. Publishing is CurseForge's own
# packager, triggered by the repository webhook on a tag (AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check the Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          files=$(grep -v '^#' Apotheca.toc | tr -d '\r' | sed '/^$/d')
          luac5.1 -p $files Tools/ApothecaProbe/ApothecaProbe.lua

      # ApothecaItems.lua is generated; it must match what the generator
      # makes from the committed scan, or someone hand-edited it.
      - name: Item data matches its generator
        run: |
          # Items deliberately left out must be in the skipped report, not
          # lost: Whipper Root Tuber and Full Moonshine (own cooldown),
          # Restorative Bread (percentage), Scooby Snack (no Use text),
          # Mana Ruby (mage gem). And items the bar must offer are present:
          # potions, healthstones, a ration, Holy Water, Dense Runecloth
          # and Forest Mushroom Cap (add a mana gem, 8008, once #15 is in).
          python3 Tools/build_item_tables.py docs/forever-consumables-69977.tsv \
            --expect-skipped 11951 1072 282018 8243 8008 \
            --expect-present 13446 13444 9421 19013 19060 227813 232433 4604 > /dev/null
          git diff --exit-code --ignore-cr-at-eol ApothecaItems.lua

      - name: Unit tests
        run: |
          for f in tests/test_*.lua; do
            echo "-- $f"
            lua5.1 "$f" || exit 1
          done

      # Same packager SHA as Priestly, which carries Forever flavor support.
      - name: Package (dry run)
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      # The zip must hold the TOC and the Lua it lists, and nothing else.
      - name: The package ships only the addon files
        run: |
          zip=$(ls .release/*.zip | head -1)
          rm -rf unpacked && mkdir unpacked && unzip -q "$zip" -d unpacked
          { echo Apotheca.toc; grep -v '^#' Apotheca.toc | tr -d '\r' | sed '/^$/d'; } | sort > expected.txt
          (cd unpacked/Apotheca && find . -type f | sed 's|^\./||' | sort) > actual.txt
          diff -u expected.txt actual.txt
          # ...and nothing outside Apotheca/ (no ApothecaProbe, no Tools).
          extra=$(cd unpacked && find . -mindepth 1 -maxdepth 1 ! -name Apotheca)
          test -z "$extra" || { echo "zip has entries outside Apotheca/: $extra"; exit 1; }

      # .release is hidden; upload-artifact skips hidden content by default.
      - name: Keep the zip for inspection
        uses: actions/upload-artifact@v4
        with:
          name: apotheca-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
